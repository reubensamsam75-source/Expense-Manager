<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Decuples Wealth & Asset Manager</title>
    <meta name="description" content="An elegant, secure, full-stack asset, currency and expense manager to track, categorize, and analyze your finances with AI insights and market opportunities." />
    <meta property="og:title" content="Decuples Wealth & Asset Manager" />
    <meta property="og:description" content="An elegant, secure, full-stack asset, currency and expense manager to track, categorize, and analyze your finances with AI insights and market opportunities." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('decu_theme');
          var valid = ['light', 'warm', 'dark', 'ocean', 'forest', 'violet'];
          var theme = valid.indexOf(saved) !== -1
            ? saved
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          var darkThemes = ['dark', 'ocean', 'forest', 'violet'];
          var isDark = darkThemes.indexOf(theme) !== -1;
          document.documentElement.setAttribute('data-theme', theme);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 selection:bg-indigo-100 selection:text-indigo-900 dark:selection:bg-indigo-950 dark:selection:text-indigo-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
